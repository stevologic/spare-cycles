name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r server/requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Front-end syntax check
        run: node --check web/app.js
      - name: Byte-compile everything
        run: python -m compileall -q server connector tools
