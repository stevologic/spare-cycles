name: Docker images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.server
      - .dockerignore
      - connector/**
      - server/**
      - web/**
      - .github/workflows/docker.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: spare-cycles, dockerfile: Dockerfile }
          - { image: spare-cycles-server, dockerfile: Dockerfile.server }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/stevologic/${{ matrix.image }}:latest
            ghcr.io/stevologic/${{ matrix.image }}:${{ github.sha }}
